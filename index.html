<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><3</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            transform-style: preserve-3d;
        }

        .ui_love_word {
            color: #ea80b0;
            font-size: 1rem;
            position: absolute;
            text-shadow: 0 0 8px #ffb3d9;
            white-space: nowrap;
            opacity: 0;
            animation: heart-anim 6s infinite linear;
        }

        @keyframes heart-anim {
            0% { 
                opacity: 0; 
                transform: translate3d(var(--x), var(--y), 0) scale(0.8); 
            }
            10% { 
                opacity: 1; 
                transform: translate3d(var(--x), var(--y), 0) scale(1); 
            }
            70% { 
                opacity: 1; 
                transform: translate3d(var(--x), var(--y), 0) scale(1); 
            }
            100% { 
                opacity: 0; 
                transform: translate3d(var(--x), var(--y), 0) scale(0.9); 
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: #1a1a1a;
            border: 2px solid #ea80b0;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(234, 128, 176, 0.4);
            max-width: 80%;
            width: 300px;
        }

        .modal-title {
            color: #ea80b0;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #ffb3d9;
        }

        .modal-btn {
            background-color: #ea80b0;
            color: #000;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 10px #ea80b0;
        }

        .modal-btn:hover {
            background-color: #ffb3d9;
            transform: scale(1.05);
            box-shadow: 0 0 15px #ffb3d9;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="step1">
            <div class="modal-title">Gabi..</div>
            <button class="modal-btn" onclick="nextStep(2)">Słucham</button>
        </div>

        <div class="modal-box" id="step2" style="display: none;">
            <div class="modal-title">Kocham cię</div>
            <button class="modal-btn" onclick="startAnimation()">:3</button>
        </div>
    </div>

    <div class="container" id="heart-container"></div>

    <script>
        function nextStep(step) {
            if (step === 2) {
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "block";
            }
        }

        function startAnimation() {
            document.getElementById("modal-overlay").style.display = "none";
            createHeart();
        }

        const text = "I love you";
        const container = document.getElementById("heart-container");
        const totalWords = 60; 

        function createHeart() {
            for (let i = 0; i < totalWords; i++) {
                const wordElement = document.createElement("div");
                wordElement.className = "ui_love_word";
                wordElement.innerText = text;

                const angle = (i / totalWords) * 2 * Math.PI;

                const x = 16 * Math.pow(Math.sin(angle), 3);
                const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

                const scale = 13; 
                const finalX = x * scale;
                const finalY = y * scale;

                wordElement.style.setProperty('--x', `${finalX}px`);
                wordElement.style.setProperty('--y', `${finalY}px`);

                const delay = i * 0.1; 
                wordElement.style.animationDelay = `${delay}s`;

                container.appendChild(wordElement);
            }
        }
    </script>
</body>
</html>
