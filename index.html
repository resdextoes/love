<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title><3</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100dvh;
            overflow: hidden;
            perspective: 1000px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
        }

        /* Napis w centrum serca - zablokowany idealnie na środku */
        .center-text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 90%;
            max-width: 320px;
            text-align: center;
            pointer-events: none;
        }

        .center-text {
            color: #ffb3d9;
            font-size: clamp(0.9rem, 3.8vw, 1.5rem);
            font-weight: bold;
            line-height: 1.35;
            text-shadow: 0 0 10px #ea80b0, 0 0 20px #ea80b0;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            word-wrap: break-word;
            user-select: none;
        }

        .center-text.visible {
            opacity: 1;
        }

        /* Słowa tworzące serce - rozdzielczość czcionki dopasowuje się do ekranu */
        .ui_love_word {
            color: #ea80b0;
            font-size: clamp(0.6rem, 1.1vw, 0.85rem);
            position: absolute;
            top: 50%;
            left: 50%;
            text-shadow: 0 0 5px #ffb3d9;
            white-space: nowrap;
            opacity: 0;
            will-change: transform, opacity;
            animation: heart-anim 6s infinite linear;
            user-select: none;
        }

        @keyframes heart-anim {
            0% { 
                opacity: 0; 
                transform: translate(-50%, -50%) translate3d(var(--x), var(--y), 0) scale(0.8); 
            }
            10% { 
                opacity: 1; 
                transform: translate(-50%, -50%) translate3d(var(--x), var(--y), 0) scale(1); 
            }
            70% { 
                opacity: 1; 
                transform: translate(-50%, -50%) translate3d(var(--x), var(--y), 0) scale(1); 
            }
            100% { 
                opacity: 0; 
                transform: translate(-50%, -50%) translate3d(var(--x), var(--y), 0) scale(0.9); 
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background-color: #1a1a1a;
            border: 2px solid #ea80b0;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 25px rgba(234, 128, 176, 0.35);
            width: 100%;
            max-width: 320px;
        }

        .modal-title {
            color: #ea80b0;
            font-size: 1.8rem;
            margin-bottom: 24px;
            text-shadow: 0 0 8px #ffb3d9;
            font-weight: bold;
        }

        .modal-btn {
            background-color: #ea80b0;
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
            box-shadow: 0 0 12px #ea80b0;
            width: 80%;
            max-width: 200px;
        }

        .modal-btn:active {
            background-color: #ffb3d9;
            transform: scale(0.96);
            box-shadow: 0 0 18px #ffb3d9;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="step1">
            <div class="modal-title">Gabi..</div>
            <button class="modal-btn" onclick="nextStep(2)">Słucham</button>
        </div>

        <div class="modal-box" id="step2" style="display: none;">
            <div class="modal-title">Kocham cię</div>
            <button class="modal-btn" onclick="startAnimation()">:3</button>
        </div>
    </div>

    <div class="container" id="heart-container">
        <div class="center-text-container" id="center-text-container">
            <div class="center-text" id="center-text">Zostaniesz moją dziewczyną?</div>
        </div>
    </div>

    <script>
        function nextStep(step) {
            if (step === 2) {
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "block";
            }
        }

        function startAnimation() {
            document.getElementById("modal-overlay").style.display = "none";
            document.getElementById("center-text").classList.add("visible");
            createHeart();
        }

        const text = "I love you";
        const container = document.getElementById("heart-container");

        function calculateScale() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            const maxSafeWidth = screenWidth * 0.75;
            const scaleFromWidth = maxSafeWidth / 32;

            const maxSafeHeight = screenHeight * 0.55;
            const scaleFromHeight = maxSafeHeight / 30;

            return Math.min(scaleFromWidth, scaleFromHeight);
        }

        function createHeart() {
            const centerTextContainer = document.getElementById("center-text-container");
            container.innerHTML = "";
            if (centerTextContainer) {
                container.appendChild(centerTextContainer);
            }

            const scale = calculateScale();

            // Dynamiczne wyliczenie ilości słów dla zachowania stałej gęstości
            const totalWords = Math.max(40, Math.round(scale * 7.5));
            const animationDuration = 6; // długość pętli animacji w sekundach

            for (let i = 0; i < totalWords; i++) {
                const wordElement = document.createElement("div");
                wordElement.className = "ui_love_word";
                wordElement.innerText = text;

                const angle = (i / totalWords) * 2 * Math.PI;

                const x = 16 * Math.pow(Math.sin(angle), 3);
                const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

                const finalX = x * scale;
                const finalY = y * scale;

                wordElement.style.setProperty('--x', `${finalX}px`);
                wordElement.style.setProperty('--y', `${finalY}px`);

                // Równomierne rozłożenie w czasie trwania całej animacji (6s)
                const delay = (i / totalWords) * animationDuration;
                wordElement.style.animationDelay = `${delay}s`;

                container.appendChild(wordElement);
            }
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (document.getElementById("modal-overlay").style.display === "none") {
                    createHeart();
                }
            }, 200);
        });
    </script>
</body>
</html>
